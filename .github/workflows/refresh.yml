name: Refresh parcel data

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC (early morning Eastern)
  workflow_dispatch:
    inputs:
      only:
        description: "Counties to refresh, comma-separated (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline self-test
        run: python3 tests/test_pipeline.py
      - name: Pull county data
        id: pull
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            python3 -u run.py --only "${{ inputs.only }}" 2>&1 | tee run.log
          else
            python3 -u run.py 2>&1 | tee run.log
          fi
          exit ${PIPESTATUS[0]}
      - name: Save results to the repository
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add -f data/parcels.json run.log || true
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%F)"
          git push
      - name: Report failure if any county failed
        if: steps.pull.outcome == 'failure'
        run: |
          echo "At least one county failed. See run.log." && exit 1
