name: Refresh parcel data

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC (early morning Eastern)
  workflow_dispatch:
    inputs:
      only:
        description: "Counties to refresh, comma-separated (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline self-test
        run: python3 tests/test_pipeline.py
      - name: Pull county data, saving after each county
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          # Always work from the newest commit on main, whatever commit this job was started from.
          sync() { git fetch -q origin main && git reset -q --hard FETCH_HEAD; }
          COUNTIES="${{ inputs.only }}"
          [ -z "$COUNTIES" ] && COUNTIES="miami-dade,broward,palm-beach"
          FAILED=""
          KEEP="$RUNNER_TEMP/keep"
          for C in ${COUNTIES//,/ }; do
            sync
            echo "=== $C $(date -u +%T) ==="
            python3 -u run.py --only "$C" || FAILED="$FAILED $C"
            python3 tools/build_site.py
            # Set this run's output aside, then lay it over the newest main and push. No merging of data files.
            rm -rf "$KEEP" && mkdir -p "$KEEP/data" "$KEEP/docs"
            cp data/parcels.json "$KEEP/data/" && cp docs/data.json docs/boundaries.json "$KEEP/docs/" && cp -r boundaries "$KEEP/"
            SAVED=""
            for TRY in 1 2 3 4 5; do
              sync
              cp "$KEEP/data/parcels.json" data/ && cp "$KEEP"/docs/* docs/ && cp -r "$KEEP/boundaries/." boundaries/
              git add -f data/parcels.json boundaries docs
              git diff --cached --quiet || git commit -q -m "Data refresh $C $(date -u +%F)"
              if git push -q origin HEAD:main; then SAVED=1; break; fi
              echo "save attempt $TRY failed, retrying"; sleep $((TRY * 7))
            done
            [ -z "$SAVED" ] && { echo "COULD NOT SAVE $C"; FAILED="$FAILED $C(save)"; }
          done
          if [ -n "$FAILED" ]; then echo "Failed:$FAILED"; exit 1; fi
