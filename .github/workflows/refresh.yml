name: Refresh parcel data

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC (early morning Eastern)
  workflow_dispatch:
    inputs:
      only:
        description: "Counties to refresh, comma-separated (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline self-test
        run: python3 tests/test_pipeline.py
      - name: Pull county data, saving after each county
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          COUNTIES="${{ inputs.only }}"
          [ -z "$COUNTIES" ] && COUNTIES="miami-dade,broward,palm-beach"
          FAILED=""
          : > run.log
          for C in ${COUNTIES//,/ }; do
            echo "=== $C $(date -u +%T) ===" | tee -a run.log
            python3 -u run.py --only "$C" 2>&1 | tee -a run.log
            [ "${PIPESTATUS[0]}" -ne 0 ] && FAILED="$FAILED $C"
            git add -f data/parcels.json run.log boundaries
            git diff --cached --quiet || git commit -q -m "Data refresh $C $(date -u +%F)"
            git stash -u -q || true
            for TRY in 1 2 3 4; do
              git pull -q --rebase origin main && git push -q && break
              echo "push attempt $TRY failed, retrying"; sleep $((TRY * 7))
            done
            git stash pop -q || true
          done
          if [ -n "$FAILED" ]; then echo "Failed counties:$FAILED"; exit 1; fi
